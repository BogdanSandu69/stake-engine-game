<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Golden Dragon Deluxe - Stake Engine</title>
    <script src="https://pixijs.download/v8.0.0/pixi.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: #aaa;
            font-size: 0.9em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #0f3460, #16213e);
            border: 2px solid #e94560;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .stat-box label {
            display: block;
            font-size: 0.75em;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-box .value {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd700;
        }

        #gameCanvas {
            width: 100%;
            height: auto;
            border: 3px solid #ffd700;
            border-radius: 10px;
            margin-bottom: 20px;
            background: #0a0e27;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.75em;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bet-control {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(233, 69, 96, 0.6);
        }

        button:active:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #spinBtn {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            grid-column: span 2;
            font-size: 1.2em;
            padding: 15px;
        }

        #spinBtn:hover:not(:disabled) {
            box-shadow: 0 8px 20px rgba(255, 215, 0, 0.6);
        }

        input[type="number"] {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background: #1a1a2e;
            color: #ffd700;
            font-size: 1em;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .info {
            text-align: center;
            font-size: 0.85em;
            color: #aaa;
            margin-top: 10px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .success {
            background: #51cf66;
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .controls {
                grid-template-columns: 1fr;
            }

            #spinBtn {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎰 Golden Dragon Deluxe</h1>
            <p>Stake Engine - Powered by PIXI.js</p>
        </div>

        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>

        <div class="stats">
            <div class="stat-box">
                <label>💰 Balance</label>
                <div class="value" id="balanceDisplay">$1000.00</div>
            </div>
            <div class="stat-box">
                <label>🎲 Bet</label>
                <div class="value" id="betDisplay">$1.00</div>
            </div>
            <div class="stat-box">
                <label>🎉 Last Win</label>
                <div class="value" id="winDisplay">$0.00</div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <div class="control-group" style="grid-column: span 2;">
                <label>🎯 Bet Size</label>
                <div class="bet-control">
                    <button id="betDownBtn">− Decrease</button>
                    <input type="number" id="betInput" value="1.00" step="0.10" min="0.10" max="100.00">
                    <button id="betUpBtn">+ Increase</button>
                </div>
            </div>
            <button id="spinBtn">🎰 SPIN</button>
            <button id="resetBtn">↻ Reset</button>
        </div>

        <div class="info">
            <p>RTP: 96% | Volatility: High | Paylines: 25</p>
            <p>© 2024 Stake Engine - Licensed & Compliant</p>
        </div>
    </div>

    <script src="slot-game.js"></script>
</body>
</html>
